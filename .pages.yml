media:
  input: media/mechanics
  output: /FireOn/media/mechanics

content:
  - name: mechanics
    label: Механики сервера
    type: file
    path: data/mechanics.json
    format: json
    list: true
    fields:
      - name: title
        label: Название публикации
        type: string
        required: true
      - name: date
        label: Дата публикации
        type: date
      - name: tags
        label: Ключевые слова для поиска
        type: string
        list: true
      - name: image
        label: Изображение
        type: image
        options:
          path: media/mechanics
          extensions: [png, jpg, jpeg, webp]
      - name: body
        label: Текст публикации
        type: rich-text
        required: true
        options:
          format: html
          media: false
